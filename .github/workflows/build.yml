name: Build DY-Tools
# Automatic build verification

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          brew install ldid dpkg

      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git "$HOME/theos"

      - name: Build
        run: |
          export THEOS="$HOME/theos"
          make clean
          make package FINALPACKAGE=1

      - name: Collect packages
        run: |
          mkdir -p artifacts
          find . -type f -name "*.deb" -exec cp {} artifacts/ \;
          find . -type f -name "*.ipa" -exec cp {} artifacts/ \;
          ls -lah artifacts

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: DY-Tools
          path: artifacts/*
